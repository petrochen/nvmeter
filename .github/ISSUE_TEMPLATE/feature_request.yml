name: Feature request
description: An idea for something NVMeter should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and the question you want answered, for example "before a shoot I want to know which cards can record 6K BRAW".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How NVMeter could help
  - type: textarea
    id: today
    attributes:
      label: What you use today
      description: Other apps or commands you reach for instead.
