name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: App bundle
        run: make app
      - name: CLI self-test (no disk access)
        run: build/NVMeter.app/Contents/MacOS/NVMeter --speedtest-selftest
